name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Every export resolves
        run: node scripts/check-exports.mjs

      - name: The package is publishable
        run: npm pack --dry-run
