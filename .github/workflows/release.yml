name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0-beta.2)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@sourceant'

      - name: Read version from file
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # The tag and the manifest have to agree, or the package published under
      # a tag is not the one that tag names.
      - name: Validate version
        run: |
          FILE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_VERSION="${{ github.event.inputs.version }}"
          else
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ "$RELEASE_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Version mismatch: Input/Tag ($RELEASE_VERSION) != package.json ($FILE_VERSION)"
            exit 1
          fi
          echo "Version validated: $FILE_VERSION"

      - name: Every export resolves
        run: node scripts/check-exports.mjs

      # Read before publishing, because a version published without notes
      # cannot be published again to add them.
      - name: Release notes from the changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v version="$VERSION" '
          BEGIN { found=0; printing=0 }
          /^## \[/ {
            if (found && printing) exit
            if ($0 ~ "\\[" version "\\]") { found=1; printing=1; next }
          }
          found && printing { print }
          ' CHANGELOG.md > "${{ runner.temp }}/notes.md"
          if [ ! -s "${{ runner.temp }}/notes.md" ]; then
            echo "::error::No changelog entry for $VERSION"
            exit 1
          fi

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
